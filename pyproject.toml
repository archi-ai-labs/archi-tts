[project]
name = "archi-tts"
dynamic = ["version"]
description = "Local Vietnamese TTS for video dubbing, served over MCP (VieNeu presets + OmniVoice cloning)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "mcp>=1.20",
    "vieneu>=3.8",
    "omnivoice>=0.2",
    "sea-g2p>=0.10",
    "soundfile",
    "numpy",
    "pyyaml",
]

[project.scripts]
archi-tts = "archi_tts.server:main"
archi-tts-setup = "archi_tts.setup_cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The version lives only in .claude-plugin/plugin.json (marketplace standard §8.1).
[tool.hatch.version]
path = ".claude-plugin/plugin.json"
pattern = '"version":\s*"(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["src/archi_tts"]

[tool.pytest.ini_options]
testpaths = ["tests"]

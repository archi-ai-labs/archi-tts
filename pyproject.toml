[project]
name = "archi-tts"
dynamic = ["version"]
description = "Local Vietnamese TTS for video dubbing, served over MCP (VieNeu presets + OmniVoice cloning)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "mcp>=1.20",
    "vieneu>=3.8",
    "sea-g2p>=0.10",
    "soundfile",
    "numpy",
    "pyyaml",
]

# Voice cloning (OmniVoice + torch, ~1 GB of libraries and a 3.3 GB model) is opt-in:
# the default "lite" install has only the built-in VieNeu voices.
[project.optional-dependencies]
full = ["omnivoice>=0.2"]

[project.scripts]
archi-tts = "archi_tts.server:main"
archi-tts-setup = "archi_tts.setup_cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The version lives only in .claude-plugin/plugin.json (marketplace standard §8.1).
[tool.hatch.version]
path = ".claude-plugin/plugin.json"
pattern = '"version":\s*"(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["src/archi_tts"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Bộ test cố định cho benchmark. role: nu | nam (giọng Bắc). emotion: nhãn cảm xúc của clip tham chiếu.
# Cú pháp trong text: [ngắt 0.8s] = chèn khoảng lặng; *từ* = nhấn (micro-pause + tăng gain nhẹ).

- id: t1_thuyet_minh
  title: Thuyết minh video (~40s)
  segments:
    - role: nu
      text: >-
        Chào mừng các bạn quay trở lại với kênh. Trong video hôm nay, chúng ta sẽ cùng nhau tìm hiểu
        vì sao những chiếc máy tính dùng chip Apple lại tiết kiệm điện đến vậy. Câu trả lời nằm ở cách
        thiết kế: bộ xử lý, bộ nhớ và nhân đồ họa được đặt chung trên một con chip duy nhất. Nhờ đó,
        dữ liệu không phải đi một quãng đường dài, máy chạy mát hơn và pin dùng được lâu hơn. Tuy nhiên,
        thiết kế này cũng có điểm trừ, đó là bạn không thể tự nâng cấp bộ nhớ sau khi mua. Vậy có nên
        mua hay không? Hãy cùng xem tiếp nhé.

- id: t2_hoi_thoai
  title: Hội thoại nam/nữ
  segments:
    - {role: nu, text: "Anh ơi, cuối tuần này mình đi đâu chơi không?"}
    - {role: nam, text: "Đi Ba Vì đi em, nghe nói trên đó đang mùa hoa dã quỳ đẹp lắm."}
    - {role: nu, text: "Thật á? Nhưng mà dự báo thời tiết bảo có mưa đấy."}
    - {role: nam, text: "Thế thì mình mang thêm áo mưa, có sao đâu. Đi sớm về sớm là được."}

- id: t3_so_viet_tat
  title: Số, ngày, viết tắt, tiếng Anh
  segments:
    - role: nu
      text: >-
        Ngày 15/8/2025, giá vàng tăng 12,5% so với cùng kỳ. Tại TP.HCM, hơn 1.250.000 người đã
        tiêm vắc xin COVID-19. Chiếc iPhone 16 Pro có giá khoảng 25 triệu đồng, dùng chip mới với
        GPU mạnh hơn 30%. Buổi họp bắt đầu lúc 14h30, cách trung tâm 3km. Các ứng dụng AI ngày càng phổ biến.

- id: t4_doan_dai
  title: Đoạn dài ~2 phút (kiểm tra ổn định)
  segments:
    - role: nam
      text: >-
        Hà Nội vào thu là lúc thành phố đẹp nhất trong năm. Buổi sáng, sương mỏng phủ trên mặt hồ
        Gươm, những hàng cây bên đường bắt đầu chuyển sang màu vàng nhạt. Người ta thấy những gánh
        hàng rong chở đầy hoa cúc họa mi đi qua các con phố cổ, để lại một mùi hương rất nhẹ. Ở góc
        phố Hàng Bông, ông cụ bán cốm vẫn ngồi đó như mấy chục năm nay, gói từng nắm cốm xanh trong
        lá sen. Khách quen đi qua, dừng lại hỏi han vài câu, rồi lại vội vã hòa vào dòng người. Buổi
        trưa, nắng trở nên vàng hơn, trong hơn, không còn gay gắt như những ngày hè. Học sinh tan
        trường ríu rít trên vỉa hè, tiếng còi xe xen lẫn tiếng rao quen thuộc. Chiều xuống, gió hồ
        Tây thổi lồng lộng, những đôi bạn trẻ ngồi bên bờ kè ngắm hoàng hôn đỏ rực cuối trời. Khi
        đèn đường bật sáng, phố phường lại mang một vẻ khác, vừa náo nhiệt vừa trầm mặc. Những quán
        cà phê nhỏ chật kín người, câu chuyện kéo dài đến tận khuya. Có lẽ vì thế mà dù đi đâu, người
        Hà Nội vẫn luôn nhớ về mùa thu của mình, nhớ cái se lạnh đầu mùa, nhớ mùi hoa sữa nồng nàn,
        và nhớ cả những buổi chiều lang thang không có mục đích. Mùa thu Hà Nội không ồn ào, không
        rực rỡ, nhưng đủ để khiến người ta thương nhớ mãi.

- id: t5_cam_xuc
  title: Cảm xúc qua clip tham chiếu
  segments:
    - {role: nu, emotion: vui, text: "Trời ơi, cuối cùng thì mình cũng làm được rồi! Vui quá đi mất!"}
    - {role: nu, emotion: buon, text: "Từ ngày anh đi, căn nhà này bỗng trở nên trống trải lạ thường."}
    - {role: nam, emotion: tuc_gian, text: "Tôi đã nói bao nhiêu lần rồi, sao anh vẫn không chịu nghe?"}
    - {role: nam, emotion: trung_tinh, text: "Theo thông tin từ trung tâm khí tượng, ngày mai Hà Nội có mưa rào và dông."}

- id: t6_ngat_nhan
  title: Ngắt nghỉ & nhấn từ
  segments:
    - role: nu
      text: >-
        Đây là điều quan trọng nhất. [ngắt 1.0s] Bạn *phải* sao lưu dữ liệu trước khi cập nhật.
        [ngắt 0.6s] Nếu không, *toàn bộ* ảnh và tài liệu có thể bị mất.
